# 仅用于描述镜像运行方式；本次只构建镜像，不启动容器。
services:
  yueyue:
    build:
      context: .
      dockerfile: Dockerfile
    image: yueyue-blog:latest
    container_name: yueyue
    restart: unless-stopped
    ports:
      - "1181:1081"
    environment:
      NODE_ENV: production
      PORT: "1081"
      CLUSTER_WORKERS: "2"
      SSO_ISSUER: ${SSO_ISSUER:-https://mindustry.wiki:1090}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-yzfwe-blog}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      # 授权码回调进后端换 token
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-https://mindustry.wiki:1081/api/auth/sso/callback}
      # 换码后跳前端登录落地页
      SSO_POST_LOGIN_REDIRECT: ${SSO_POST_LOGIN_REDIRECT:-https://mindustry.wiki:1081/auth/sso/callback}
      SSO_ROOT_USER_IDS: ${SSO_ROOT_USER_IDS:-0}
      JWT_SECRET: ${JWT_SECRET:-yueyuedao-blog-jwt}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # 持久化 SQLite 与上传
      - ./backend/prisma:/app/backend/prisma
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1081/api/site"]
      interval: 30s
      timeout: 5s
      retries: 3
